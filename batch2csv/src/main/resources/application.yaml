spring:
  application:
    name: batch2csv

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/batchdb2csv}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  sql:
    init:
      mode: always

  batch:
    jdbc:
      initialize-schema: always

    job:
      enabled: false
